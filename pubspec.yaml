name: waiver_driver
description: "Waiver Driver App"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  get_storage: ^2.1.1
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.5.3
  geolocator: ^13.0.2
  sms_autofill: ^2.4.1
  flutter_screenutil: ^5.9.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  http: ^1.2.2
  audioplayers: ^6.0.0
  cached_network_image: ^3.4.1

  connectivity_plus: ^6.1.1
  internet_connection_checker: ^3.0.1
  flutter_callkit_incoming:

  share_plus: ^10.1.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  awesome_notifications: ^0.10.0
  google_sign_in: ^6.1.4
  web_socket_channel: ^3.0.1
  url_launcher: ^6.2.6
  flutter_custom_utils: ^0.4.23
  permission_handler: ^11.3.1
  websocket_universal: ^1.2.5
  flutter_overlay_window: ^0.4.4
  mobility_features: ^6.0.0
  location: ^8.0.0
#  carp_background_location: ^4.0.0
  external_app_launcher: ^4.0.0
  upgrader: ^11.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_background: ^1.3.0+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons:
  change_app_package_name: ^1.1.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  alpha : true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/



 